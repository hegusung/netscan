[Format]
time = %Y/%m/%d %H:%M:%S
# Generic formats with color depending on the message type (vuln, major...)
default    = [{{ time }}]     {{ color }}{{ message }}{{ reset }}
target     = [{{ time }}]     {{ color }}{{ "%-50s"|format(target) }} {% if hostname %}[{{hostname}}] {% endif %}{{ message }}{{ reset }}
# Specific formats
http       = [{{ time }}]     {{ white }}{{ "%-50s"|format(target) }} {{ code }} ({{ content_type }})  {{ "%-40s"|format(server) }} {{ title }}{{ reset }}
dns        = [{{ time }}]     {{ white }}{{ "%-50s"|format(target) }} {{ "%-5s"|format(query_type) }}   {{ resolved }}{{ reset }}
dns_dc     = [{{ time }}]     {{ white }}Domain Controler:  {{ "%-50s"|format(hostname) }} {{ "%-30s"|format(domain) }} {{ ips }}{{ reset }}
port       = [{{ time }}]     {{ white }}{{ "%-50s"|format(target) }} {{ "%-30s"|format(service) }} {{ version }}{{ reset }}
smb        = [{{ time }}]     {{ white }}{{ "%-30s"|format(target) }} {{ "%-30s"|format(domain) }} {{ "%-30s"|format(hostname) }} {{ "%-30s"|format(server_os) }} Signed:{{ signing }} SMBv1:{{ smbv1 }}{{ reset }}
mssql      = [{{ time }}]     {{ white }}{{ "%-50s"|format(target) }} {{ version }}{{ reset }}
mysql      = [{{ time }}]     {{ white }}{{ "%-50s"|format(target) }} {{ version }}{{ reset }}
postgresql = [{{ time }}]     {{ white }}{{ "%-50s"|format(target) }} {{ version }}{{ reset }}
# Authentication
auth_success_password = [{{ time }}]     {{ green }}{{ "%-50s"|format(target) }} {% if hostname %}[{{hostname}}] {% endif %}Authentication success with credentials {{ domain }}\{{ username }} and password {{ password }}{{ reset }}{% if is_admin %}
	[{{ time }}]     {{ red }}{{ "%-50s"|format(target) }} {% if hostname %}[{{hostname}}] {% endif %}Administrative privileges with credentials {{ domain }}\{{ username }}{{ reset }}{% endif %}
auth_failure_password = [{{ time }}]     {{ blue }}{{ "%-50s"|format(target) }} {% if hostname %}[{{hostname}}] {% endif %}Authentication failure with credentials {{ domain }}\{{ username }} and password {{ password }}{{ reset }}
auth_success_hash = [{{ time }}]     {{ green }}{{ "%-50s"|format(target) }} {% if hostname %}[{{hostname}}] {% endif %}Authentication success with credentials {{ domain }}\{{ username }} and hash {{ hash }}{{ reset }}{% if is_admin %}
	[{{ time }}]     {{ red }}{{ "%-50s"|format(target) }} {% if hostname %}[{{hostname}}] {% endif %}Administrative privileges with credentials {{ domain }}\{{ username }}{{ reset }}{% endif %}
auth_failure_hash = [{{ time }}]     {{ blue  }}{{ "%-50s"|format(target) }} {% if hostname %}[{{hostname}}] {% endif %}Authentication failure with credentials {{ domain }}\{{ username }} and hash {{ hash }}{{ reset }}
auth_success_kerberos = [{{ time }}]     {{ green }}{{ "%-50s"|format(target) }} {% if hostname %}[{{hostname}}] {% endif %}Authentication success with ticket {{ ticket }} ({{ domain }}\{{ username }}){{ reset }}{% if is_admin %}
	[{{ time }}]     {{ red }}{{ "%-50s"|format(target) }} {% if hostname %}[{{hostname}}] {% endif %}Administrative privileges with ticket {{ ticket }} ({{ domain }}\{{ username }}){{ reset }}{% endif %}
auth_failure_kerberos = [{{ time }}]     {{ blue  }}{{ "%-50s"|format(target) }} {% if hostname %}[{{hostname}}] {% endif %}Authentication failure with ticket {{ ticket }} ({{ domain }}\{{ username }}){{ reset }}

[Color]
vuln = red
major = red
highlight = yellow
minor = blue
success = green
error = bold red
normal = white
