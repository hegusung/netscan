[Format]
time = %Y/%m/%d %H:%M:%S
# Generic formats with color depending on the message type (vuln, major...)
default    = [{{ time }}]     {{ color }}{{ message }}{{ reset }}
#target     = [{{ time }}]     {{ color }}{{ "%-50s"|format(target) }} {{ message }}{{ reset }}
target     = [{{ time }}] {{ blue }}{{ "%-6s"|format(protocol) }}{{ reset }}         {{ "%-16s"|format(host) }} {{ "%-6s"|format(port) }} {{ "%-18s"|format(hostname) }} {{ blue }}[*]{{ reset }} {{ color }}{{ message }}{{ reset }}
# Specific formats
http       = [{{ time }}]     {{ white }}{{ "%-50s"|format(target) }} {{ code }} ({{ content_type }})  {{ "%-40s"|format(server) }} {{ title }}{{ reset }}
dns        = [{{ time }}]     {{ white }}{{ "%-50s"|format(target) }} {{ "%-5s"|format(query_type) }}   {{ resolved }}{{ reset }}
dns_dc     = [{{ time }}]     {{ white }}Domain Controler:  {{ "%-50s"|format(hostname) }} {{ "%-30s"|format(domain) }} {{ ips }}{{ reset }}
port       = [{{ time }}]     {{ white }}{{ "%-50s"|format(target) }} {{ "%-30s"|format(service) }} {{ version }}{{ reset }}
#smb        = [{{ time }}]     {{ white }}{{ "%-30s"|format(target) }} {{ "%-30s"|format(domain) }} {{ "%-30s"|format(hostname) }} {{ "%-30s"|format(server_os) }} Signed:{{ signing }} SMBv1:{{ smbv1 }}{{ reset }}
smb        = [{{ time }}] {{ blue }}{{ "%-6s"|format(protocol) }}{{ reset }}         {{ "%-16s"|format(host) }} {{ "%-6s"|format(port) }} {{ "%-18s"|format(hostname) }} {{ blue }}[*]{{ reset }} {{ server_os }} (name:{{ hostname }}) (domain:{{ domain }}) ({{ green }}signing:{{ signing }}{{ reset }}) ({{ orange }}SMBv1:{{ smbv1 }}{{ reset }})
mssql      = [{{ time }}]     {{ white }}{{ "%-50s"|format(target) }} {{ version }}{{ reset }}
mysql      = [{{ time }}]     {{ white }}{{ "%-50s"|format(target) }} {{ version }}{{ reset }}
postgresql = [{{ time }}]     {{ white }}{{ "%-50s"|format(target) }} {{ version }}{{ reset }}
# Authentication
auth_success_password = [{{ time }}] {{ blue }}{{ "%-6s"|format(protocol) }}{{ reset }}         {{ "%-16s"|format(host) }} {{ "%-6s"|format(port) }} {{ "%-18s"|format(hostname) }} {{ green }}[+]{{ reset }} {{ domain }}\{{ username }}:{{ password }} {% if is_admin %}{{ orange }}(Pwn3d!){{ reset }}{% endif %}
auth_failure_password = [{{ time }}] {{ blue }}{{ "%-6s"|format(protocol) }}{{ reset }}         {{ "%-16s"|format(host) }} {{ "%-6s"|format(port) }} {{ "%-18s"|format(hostname) }} {{ red   }}[-]{{ reset }} {{ domain }}\{{ username }}:{{ password }}  {{ failure_reason }}
auth_success_hash = [{{ time }}] {{ blue }}{{ "%-6s"|format(protocol) }}{{ reset }}         {{ "%-16s"|format(host) }} {{ "%-6s"|format(port) }} {{ "%-18s"|format(hostname) }} {{ green }}[+]{{ reset }} {{ domain }}\{{ username }}:{{ hash }} {% if is_admin %}{{ orange }}(Pwn3d!){{ reset }}{% endif %}
auth_failure_hash = [{{ time }}] {{ blue }}{{ "%-6s"|format(protocol) }}{{ reset }}         {{ "%-16s"|format(host) }} {{ "%-6s"|format(port) }} {{ "%-18s"|format(hostname) }} {{ red }}[-]{{ reset }} {{ domain }}\{{ username }}:{{ hash }}  {{ failure_reason }}
auth_success_kerberos = [{{ time }}] {{ blue }}{{ "%-6s"|format(protocol) }}{{ reset }}         {{ "%-16s"|format(host) }} {{ "%-6s"|format(port) }} {{ "%-18s"|format(hostname) }} {{ green }}[+]{{ reset }} {{ domain }}\{{ username }}:KERBEROS {% if is_admin %}{{ orange }}(Pwn3d!){{ reset }}{% endif %}
auth_failure_kerberos = [{{ time }}] {{ blue }}{{ "%-6s"|format(protocol) }}{{ reset }}         {{ "%-16s"|format(host) }} {{ "%-6s"|format(port) }} {{ "%-18s"|format(hostname) }} {{ red }}[-]{{ reset }} {{ domain }}\{{ username }}:KERBEROS  {{ failure_reason }}

[Color]
vuln = red
major = red
highlight = yellow
minor = blue
success = green
error = bold red
normal = white
